<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛИЗА АРФАНЯН — Фотограф</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #faf9f7;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.5;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            padding: 3rem 2rem;
            border-radius: 0;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            border: 1px solid #eee;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            border: 1px solid #e0e0e0;
            padding: 3px;
            background: #fff;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .status {
            font-size: 0.95rem;
            color: #666;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            font-weight: 400;
        }
        .phone {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }
        .phone a {
            color: #1a1a1a;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .phone a:hover {
            border-bottom-color: #1a1a1a;
        }
        /* Общий контейнер для кнопок: вертикально, одинаковый размер */
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.75rem;
            max-width: 260px;
            margin: 0 auto;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1rem;
            border: 1px solid #1a1a1a;
            color: #1a1a1a;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            transition: background 0.2s, color 0.2s;
            background: transparent;
            font-weight: 400;
            width: 100%;
        }
        .btn:hover {
            background: #1a1a1a;
            color: #ffffff;
        }
        .btn i {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="avatar.jpg" alt="ЛИЗА АРФАНЯН" class="avatar">
        
        <h1>ЛИЗА АРФАНЯН</h1>
        <div class="status">Фотограф</div>
        
        <div class="phone">
            <a href="tel:+79190402894">+7 (919) 040-28-94</a>
        </div>
        
        <div class="buttons">
            <a href="https://api.whatsapp.com/send/?phone=79190402894&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
            <a href="https://t.me/+79190402894" target="_blank" rel="noopener" class="btn">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="contact.vcf" class="btn" download>
                <i class="fas fa-address-card"></i> Сохранить контакт
            </a>
        </div>
    </div>
</body>
</html>
