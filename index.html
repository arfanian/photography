<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b1b1b">
    <title>ЛИЗА АРФАНЯН — Фотограф</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1b1b1b;
            --panel: #222220;
            --text: #f1efe8;
            --muted: #a9a69c;
            --line: #3a3935;
            --lemon: #f2c94c;
            --rec: #e24b4a;
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .frame {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 3.2rem 2.2rem 3.4rem;
            text-align: center;
            background: var(--panel);
        }

        /* Угловые метки видоискателя */
        .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 0 solid var(--text);
            opacity: 0;
            animation: cornerIn 0.7s 0.1s cubic-bezier(.2,.8,.2,1) forwards;
        }
        .corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; --x: 12px; --y: 12px; }
        .corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; --x: -12px; --y: 12px; }
        .corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; --x: 12px; --y: -12px; }
        .corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; --x: -12px; --y: -12px; }
        @keyframes cornerIn {
            from { opacity: 0; transform: translate(var(--x), var(--y)); }
            to   { opacity: 1; transform: translate(0, 0); }
        }

        /* Верхняя строка: REC и таймкод */
        .hud-top {
            position: absolute;
            top: 18px;
            left: 52px;
            right: 52px;
            display: flex;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            color: var(--muted);
        }
        .rec { color: var(--text); }
        .rec::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--rec);
            margin-right: 7px;
            animation: blink 1.4s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Аватар с сеткой и рамкой фокуса */
        .viewport {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 1.2rem auto 1.8rem;
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(0.9) contrast(1.03);
        }
        .grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(to right, transparent calc(33.33% - 0.5px), rgba(241,239,232,0.28) calc(33.33% - 0.5px), rgba(241,239,232,0.28) calc(33.33% + 0.5px), transparent calc(33.33% + 0.5px), transparent calc(66.66% - 0.5px), rgba(241,239,232,0.28) calc(66.66% - 0.5px), rgba(241,239,232,0.28) calc(66.66% + 0.5px), transparent calc(66.66% + 0.5px)),
                linear-gradient(to bottom, transparent calc(33.33% - 0.5px), rgba(241,239,232,0.28) calc(33.33% - 0.5px), rgba(241,239,232,0.28) calc(33.33% + 0.5px), transparent calc(33.33% + 0.5px), transparent calc(66.66% - 0.5px), rgba(241,239,232,0.28) calc(66.66% - 0.5px), rgba(241,239,232,0.28) calc(66.66% + 0.5px), transparent calc(66.66% + 0.5px));
        }
        .focus {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
            border: 1.5px solid var(--text);
            animation: focusLock 1.6s 0.5s cubic-bezier(.3,.7,.2,1) forwards;
            transform: scale(3);
            opacity: 0;
        }
        @keyframes focusLock {
            0%   { transform: scale(3);   opacity: 0;   border-color: var(--text); }
            30%  { transform: scale(1.5); opacity: 1;   border-color: var(--text); }
            60%  { transform: scale(0.88); opacity: 1;  border-color: var(--text); }
            80%  { transform: scale(1);   opacity: 1;   border-color: var(--lemon); }
            100% { transform: scale(1);   opacity: 0.9; border-color: var(--lemon); }
        }
        .af {
            position: absolute;
            left: 50%;
            bottom: -22px;
            transform: translateX(-50%);
            font-family: var(--mono);
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            color: var(--lemon);
            opacity: 0;
            animation: fadeIn 0.4s 1.9s forwards;
            white-space: nowrap;
        }

        h1 {
            font-family: var(--serif);
            font-size: 2.7rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            line-height: 1.05;
            text-transform: uppercase;
            margin-top: 0.6rem;
            margin-bottom: 0.7rem;
        }
        .status {
            font-size: 0.7rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1.8rem;
        }
        .phone {
            font-family: var(--serif);
            font-size: 1.45rem;
            letter-spacing: 0.04em;
            margin-bottom: 1.9rem;
        }
        .phone a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s;
        }
        .phone a:hover { border-bottom-color: var(--lemon); }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            max-width: 290px;
            margin: 0 auto;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.95rem 1.2rem;
            border: 1px solid #5a5850;
            border-radius: 999px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: transparent;
            transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.15s;
        }
        .btn i { font-size: 0.95rem; }
        .btn:hover { border-color: var(--text); background: rgba(241,239,232,0.06); }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: var(--lemon);
            border-color: var(--lemon);
            color: #1b1b1b;
        }
        .btn-primary:hover { background: #f7d874; border-color: #f7d874; }
        .btn:focus-visible { outline: 2px solid var(--lemon); outline-offset: 3px; }

        .hud-bottom {
            position: absolute;
            bottom: 18px;
            left: 52px;
            right: 52px;
            display: flex;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.64rem;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        /* Появление блоков */
        .reveal { opacity: 0; transform: translateY(8px); animation: rise 0.7s forwards cubic-bezier(.2,.8,.2,1); }
        .r1 { animation-delay: 0.9s; }
        .r2 { animation-delay: 1.05s; }
        .r3 { animation-delay: 1.2s; }
        .r4 { animation-delay: 1.35s; }
        @keyframes rise { to { opacity: 1; transform: none; } }
        @keyframes fadeIn { to { opacity: 1; } }

        @media (max-width: 380px) {
            .frame { padding: 3rem 1.4rem 3.2rem; }
            h1 { font-size: 2.3rem; }
            .hud-top, .hud-bottom { left: 46px; right: 46px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; }
            .corner, .reveal, .af { opacity: 1; transform: none; }
            .focus { opacity: 0.9; transform: none; border-color: var(--lemon); }
        }
    </style>
</head>
<body>
    <main class="frame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="hud-top" aria-hidden="true">
            <span class="rec">REC</span>
            <span id="timecode">00:00:00</span>
        </div>

        <div class="viewport">
            <img src="avatar.jpg" alt="ЛИЗА АРФАНЯН" class="avatar">
            <div class="grid" aria-hidden="true"></div>
            <div class="focus" aria-hidden="true"></div>
            <div class="af" aria-hidden="true">AF · LOCKED</div>
        </div>

        <h1 class="reveal r1">Лиза<br>Арфанян</h1>
        <div class="status reveal r2">Фотограф</div>
        <div class="phone reveal r3">
            <a href="tel:+79190402894">+7 (919) 040-28-94</a>
        </div>
        <div class="buttons reveal r4">
            <a href="https://api.whatsapp.com/send/?phone=79190402894&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
            <a href="https://t.me/+79190402894" target="_blank" rel="noopener" class="btn">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="contact.vcf" class="btn btn-primary" download>
                <i class="fas fa-address-card"></i> Сохранить контакт
            </a>
        </div>

        <div class="hud-bottom" aria-hidden="true">
            <span>ISO 100</span>
            <span>f/1.8</span>
            <span>1/250</span>
        </div>
    </main>

    <script>
        (function () {
            var el = document.getElementById('timecode');
            var start = Date.now();
            function pad(n) { return (n < 10 ? '0' : '') + n; }
            setInterval(function () {
                var s = Math.floor((Date.now() - start) / 1000);
                el.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
            }, 1000);
        })();
    </script>
</body>
</html>
