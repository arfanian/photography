<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f2">
    <title>Liza Arfanian — Photography and retouching</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Aqua Grotesque is not on Google Fonts; Archivo at expanded width (wdth 125) is the closest free match -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f2f2f2;
            --card: #ffffff;
            --ink: #000000;
            --muted: #77777a;
            --burgundy: #7a1229;
            --burgundy-dark: #520b1b;
            --sans: 'Archivo', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: var(--sans);
            font-stretch: 125%;
            background: var(--paper);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border: 1px solid var(--ink);
        }

        /* Фото с метками кадрирования */
        .photo {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-bottom: 1px solid var(--ink);
            background: #d9d9d9;
            animation: wipe 1.1s cubic-bezier(.7, 0, .2, 1) both;
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(1) contrast(1.05);
            transition: filter 0.5s;
        }
        .photo:hover img { filter: grayscale(0) contrast(1); }
        .mark {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 0 solid var(--burgundy);
            pointer-events: none;
        }
        .mark.tl { top: 14px; left: 14px; border-top-width: 3px; border-left-width: 3px; }
        .mark.tr { top: 14px; right: 14px; border-top-width: 3px; border-right-width: 3px; }
        .mark.bl { bottom: 14px; left: 14px; border-bottom-width: 3px; border-left-width: 3px; }
        .mark.br { bottom: 14px; right: 14px; border-bottom-width: 3px; border-right-width: 3px; }

        @keyframes wipe {
            from { clip-path: inset(0 0 100% 0); }
            to   { clip-path: inset(0 0 0 0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }

        .body { padding: 1.9rem 1.6rem 0.6rem; }

        h1 {
            font-weight: 800;
            font-size: clamp(1.9rem, 10.5vw, 3.1rem);
            line-height: 0.98;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            animation: slideIn 0.7s 0.8s cubic-bezier(.2, .8, .2, 1) both;
        }
        .role {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.1rem;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--muted);
            animation: slideIn 0.7s 0.95s cubic-bezier(.2, .8, .2, 1) both;
        }
        .role::before {
            content: "";
            flex: none;
            width: 30px;
            height: 3px;
            background: var(--burgundy);
        }

        /* Меню разделов */
        .menu { margin-top: 1.9rem; }
        .row { border-top: 1px solid var(--ink); }
        .row:last-child { border-bottom: 1px solid var(--ink); }

        .row-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.15rem 0;
            background: none;
            border: 0;
            font: inherit;
            font-stretch: 125%;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
            transition: color 0.2s;
        }
        .row-toggle:hover,
        .row-toggle[aria-expanded="true"] { color: var(--burgundy); }
        .row-toggle:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 2px; }

        .plus {
            position: relative;
            width: 16px;
            height: 16px;
            flex: none;
        }
        .plus::before, .plus::after {
            content: "";
            position: absolute;
            background: currentColor;
            transition: transform 0.3s cubic-bezier(.5, 0, .2, 1);
        }
        .plus::before { left: 0; right: 0; top: 7px; height: 2px; }
        .plus::after  { top: 0; bottom: 0; left: 7px; width: 2px; }
        .row-toggle[aria-expanded="true"] .plus::after { transform: scaleY(0); }

        .panel {
            display: grid;
            grid-template-rows: 0fr;
            visibility: hidden;
            transition: grid-template-rows 0.4s cubic-bezier(.5, 0, .2, 1), visibility 0s 0.4s;
        }
        .panel.open {
            grid-template-rows: 1fr;
            visibility: visible;
            transition: grid-template-rows 0.4s cubic-bezier(.5, 0, .2, 1), visibility 0s;
        }
        .panel-inner { overflow: hidden; min-height: 0; }
        .panel-content { padding: 0.2rem 0 1.4rem; }

        /* Плашка «в разработке» */
        .plate {
            background: var(--burgundy);
            color: #fff;
            padding: 1.05rem 1.15rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Контакты */
        .phone {
            display: inline-block;
            margin-bottom: 1.1rem;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--ink);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .phone:hover { border-bottom-color: var(--burgundy); }
        .phone:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 3px; }

        .buttons { display: flex; flex-direction: column; gap: 0.6rem; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.95rem 1.1rem;
            border: 1px solid var(--ink);
            color: var(--ink);
            background: transparent;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn i { font-size: 1.05rem; }
        .btn:hover { background: var(--ink); color: #fff; }
        .btn-primary { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }
        .btn-primary:hover { background: var(--burgundy-dark); border-color: var(--burgundy-dark); }
        .btn:focus-visible { outline: 2px solid var(--burgundy); outline-offset: 3px; }

        @media (max-width: 380px) {
            .body { padding: 1.6rem 1.25rem 0.5rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="photo">
            <img src="avatar.jpg" alt="Liza Arfanian">
            <span class="mark tl" aria-hidden="true"></span>
            <span class="mark tr" aria-hidden="true"></span>
            <span class="mark bl" aria-hidden="true"></span>
            <span class="mark br" aria-hidden="true"></span>
        </div>

        <div class="body">
            <h1>Liza<br>Arfanian</h1>
            <p class="role">Photography and retouching</p>

            <nav class="menu" aria-label="Sections">
                <div class="row">
                    <button class="row-toggle" type="button" id="works-btn" aria-expanded="false" aria-controls="works-panel">
                        My works <span class="plus" aria-hidden="true"></span>
                    </button>
                    <div class="panel" id="works-panel" role="region" aria-labelledby="works-btn">
                        <div class="panel-inner">
                            <div class="panel-content">
                                <div class="plate">Section under development</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <button class="row-toggle" type="button" id="contacts-btn" aria-expanded="false" aria-controls="contacts-panel">
                        Contacts <span class="plus" aria-hidden="true"></span>
                    </button>
                    <div class="panel" id="contacts-panel" role="region" aria-labelledby="contacts-btn">
                        <div class="panel-inner">
                            <div class="panel-content">
                                <a class="phone" href="tel:+79190402894">+7 (919) 040-28-94</a>
                                <div class="buttons">
                                    <a href="https://api.whatsapp.com/send/?phone=79190402894&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="btn">
                                        WhatsApp <i class="fab fa-whatsapp" aria-hidden="true"></i>
                                    </a>
                                    <a href="https://t.me/+79190402894" target="_blank" rel="noopener" class="btn">
                                        Telegram <i class="fab fa-telegram-plane" aria-hidden="true"></i>
                                    </a>
                                    <a href="contact.vcf" class="btn btn-primary" download>
                                        Save contact <i class="fas fa-address-card" aria-hidden="true"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </main>

    <script>
        (function () {
            var toggles = document.querySelectorAll('.row-toggle');

            function setState(btn, open) {
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                document.getElementById(btn.getAttribute('aria-controls')).classList.toggle('open', open);
            }

            toggles.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var willOpen = btn.getAttribute('aria-expanded') !== 'true';
                    toggles.forEach(function (other) { setState(other, false); });
                    setState(btn, willOpen);
                });
            });
        })();
    </script>
</body>
</html>
